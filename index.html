<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Séances">
<meta name="theme-color" content="#141416">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi des séances</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
:root{--sdoneC:#1d1d1f;--done:#C6F432;--doneTxt:#111;--accInk:#111;--bg:#f5f5f3;--card:#fff;--txt:#1d1d1f;--mut:#6b6b70;--acc:#C6F432;--accTxt:#111;--ok:#d7eee2;--warn:#b35c00;--warnbg:#fdf0e0;--line:#e2e2de;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--sdoneC:#ffffff;--done:#C6F432;--doneTxt:#111;--accInk:#C6F432;--bg:#141416;--card:#1f1f23;--txt:#ececec;--mut:#9a9aa2;--acc:#C6F432;--accTxt:#111;--ok:#1f3a2c;--warn:#e89a4a;--warnbg:#3a2a18;--line:#2e2e35;color-scheme:dark}}
:root[data-theme=dark]{--sdoneC:#ffffff;--done:#C6F432;--doneTxt:#111;--accInk:#C6F432;--bg:#141416;--card:#1f1f23;--txt:#ececec;--mut:#9a9aa2;--acc:#C6F432;--accTxt:#111;--ok:#1f3a2c;--warn:#e89a4a;--warnbg:#3a2a18;--line:#2e2e35;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
html,body{overflow-x:hidden;max-width:100%}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Nunito,system-ui,sans-serif}
body{padding:0 0 env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px;border-bottom:1px solid var(--line)}
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.wk .lbl{font-weight:600;font-size:15px;text-align:center;flex:1}
.nav{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:16px}
.wk .nav{background:none;border:none;padding:4px 10px;font-size:22px;line-height:1;color:var(--txt)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mut)}
.day b{font-size:15px;color:var(--txt)}
.day i{width:6px;height:6px;border-radius:50%;background:transparent}
.day.has i{background:var(--mut)}
.day.ok i{background:var(--acc)}
.jblock{text-align:center;margin:4px 0 12px}
.jlabel{display:inline-block;font-size:18px;font-weight:800;padding:6px 15px;border-radius:999px;background:var(--acc);color:var(--accTxt);margin:0 0 10px}
#pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);z-index:30;padding:16px}
#pop.show{display:flex}
.popc{background:var(--card);border:1px solid var(--acc);border-radius:16px;padding:16px;width:min(340px,100%);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.popc h3{margin:0 0 8px;font-family:Gilroy,Montserrat,sans-serif;font-weight:800;color:var(--accInk);font-size:16px}
.popc ul{margin:0 0 12px 18px;padding:0;font-size:13px;line-height:1.5}
.popb{display:flex;gap:8px}
.popb .hb{flex:1;padding:10px}
.popb .hb.on{background:var(--acc);border-color:var(--acc);color:var(--accTxt)}
.day.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.day.today b{color:#4f8a10;text-decoration:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .day.today b{color:#C6F432}}
:root[data-theme=dark] .day.today b{color:#C6F432}
main{padding:12px;max-width:640px;margin:0 auto;padding-bottom:90px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.sumh{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:none;padding:0;font-size:14px;text-align:left;color:var(--txt)}
.sumd{margin-top:8px}
.sum .bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.sum .bar div.over{background:linear-gradient(90deg,#d4a017 0%,#f7d774 50%,#d4a017 100%);background-size:200% 100%;animation:flow 1.6s linear infinite}
@keyframes flow{from{background-position:200% 0}to{background-position:-200% 0}}
.dots{display:flex;gap:4px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.dot.on{background:var(--acc)}
#pJDays{display:flex;gap:6px;justify-content:space-between;margin:6px 0 10px}
.jdc{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:11px;font-weight:600}
.jdc.on{background:var(--acc);border-color:var(--accInk);color:var(--accTxt)}
h1,h2,h3,.lbl,.sumh b,.hbox h2,.stickyh h2{font-family:Montserrat,Nunito,sans-serif;font-weight:800;letter-spacing:.01em}
.jdbadge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0;border:1px solid var(--accInk);border-radius:50%;background:var(--acc);color:var(--accTxt);font:600 12px/1 Nunito,sans-serif;cursor:pointer}
.tip{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:400;line-height:1.45;color:var(--mut);margin-bottom:12px}
.hrow{display:flex;align-items:center;gap:8px}
.hn{flex:1;min-width:0;overflow-wrap:anywhere}
.row .rp{margin-left:auto;margin-right:10px;text-align:right;white-space:nowrap}
.grp{border:1px solid var(--line);border-radius:14px;padding:6px 10px;margin-bottom:10px}
.gt{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:4px 0 2px;text-align:center}
.ob{font-size:11px;color:var(--mut);font-weight:400;margin-left:4px}
.grp .row:last-child{border-bottom:none}
.arr{background:none;border:none;color:var(--mut);font-size:14px;padding:0 6px 0 0}
.row{align-items:center}
.hs{white-space:nowrap;color:var(--mut);min-width:36px;text-align:right}
.hk{white-space:nowrap;font-weight:600;min-width:84px;text-align:right}
.sum .bar div{height:100%;background:var(--acc)}
.sum .warn{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 10px;margin-top:8px}
.muted{color:var(--mut)}
.sess{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.sh h3{margin:0;font-size:17px}
.sh span{font-size:13px;color:var(--mut)}
.exo{display:flex;width:100%;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 12px;margin-bottom:8px;text-align:left;min-height:64px;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.exo .n{flex:1;font-size:16px;font-weight:600}
.exo .m{font-size:13px;color:var(--mut);white-space:nowrap}
.exo .p{font-size:13px;font-weight:600;min-width:34px;text-align:right;touch-action:none;padding:6px 4px;user-select:none}
.exo.full{background:rgba(198,244,50,.15);border-color:var(--accInk)}
.exo.armed{outline:2px solid var(--acc)}
.sdone{width:100%;margin-top:4px;padding:12px;border-radius:12px;border:1.5px solid var(--sdoneC);background:none;color:var(--sdoneC);font-weight:600}
.sdone.on{background:var(--done);border-color:var(--done);color:var(--doneTxt)}
.mod{width:100%;margin-top:6px;padding:10px;border-radius:12px;border:1px solid var(--line);background:none;font-weight:600}
.addex{display:inline-flex;align-items:center;justify-content:center;width:auto;min-height:0;margin:0 0 8px;padding:6px 10px;border:none;border-radius:8px;background:var(--bg);color:var(--accInk);font-size:15px;font-weight:600}
.addwrap{display:flex;justify-content:center}
.hbtns{display:flex;gap:6px;flex-wrap:nowrap;white-space:nowrap}
.sh h3{padding-left:12px;margin:0}
.hb{padding:6px 9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:12px;font-weight:600;white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.switch{position:relative;width:52px;height:30px;border-radius:999px;background:var(--line);border:none;padding:0;flex-shrink:0;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked=true]{background:var(--acc)}
.switch[aria-checked=true]::after{transform:translateX(22px)}
.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);z-index:6}
.bottom button{background:none;border:none;color:var(--mut);width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center}
.bottom button:active{color:var(--txt)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.ov.show{display:flex}
.lock{position:fixed;inset:0;background:#0e100a;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 16px 40px;z-index:40}
.lock.show{display:flex}
#lock input{background:#0e100a;border:1px solid #C6F432;color:#C6F432;border-radius:12px;outline:none}
#lock input::placeholder{color:#C6F432;opacity:1}
.lock .box{width:100%;max-width:320px;display:flex;flex-direction:column}
.modal{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal h2{margin:0 0 10px;font-size:18px}
.stickyh{position:sticky;top:0;background:var(--card);z-index:2;margin:-16px -16px 0;padding:16px 16px 4px;box-shadow:0 -30px 0 var(--card)}
.hbox{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:6px}
.hbox h2{margin:0 0 4px}
.hbox.hvolt{border:1px solid #C6F432}
.cf{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:12;padding:16px}
.cf.show{display:flex}
.cf .box{background:var(--card);border-radius:16px;padding:18px;width:min(88vw,340px)}
.nt{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:13;padding:16px}
.nt.show{display:flex}
.nt .box{background:var(--card);border-radius:16px;padding:18px;width:min(90vw,360px);font-size:14px;max-height:86vh;overflow-y:auto;scrollbar-width:none}
.nt h3{margin:0 0 8px;font-size:16px}
.warn2{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 10px;margin-top:10px;font-size:13px;line-height:1.4}
.nt input,.nt select{width:110px;font:inherit;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:4px}
.modal{max-height:76vh;max-height:76dvh;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.mini{padding:6px 14px;border-radius:999px;border:1px solid var(--acc);background:none;color:var(--accInk);font-weight:600;font-size:14px}
.desc{font-size:15px;line-height:1.4;margin-bottom:12px;padding-left:9px}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.ph{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;color:var(--mut);min-height:72px}
.ph b{display:block;text-align:center;color:var(--accInk);font-size:14px;margin-bottom:2px}
body.busy header,body.busy main{filter:blur(3px);pointer-events:none}
body.busy::after{content:'';position:fixed;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border:3px solid var(--line);border-top-color:var(--accInk);border-radius:50%;animation:spin .8s linear infinite;z-index:20}
@keyframes spin{to{transform:rotate(360deg)}}
button,.exo{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
main,header{-webkit-user-select:none;user-select:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.grid div{background:var(--bg);border-radius:10px;padding:8px;font-size:13px;color:var(--mut)}
.grid b{display:block;font-size:17px;color:var(--txt)}
textarea{width:100%;min-height:80px;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;resize:vertical}
.addbtn{display:inline-block;margin-top:12px;padding:12px 16px;border-radius:12px;border:1px solid var(--acc);background:var(--acc);color:var(--accTxt);font-weight:600}
.rm{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--mut)}
.opt{font-family:Gilroy,Montserrat,sans-serif;font-weight:800;display:block;width:100%;text-align:left;padding:14px;margin-bottom:8px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:15px;font-weight:600}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.back{width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:none;font-weight:600}
.close{width:100%;margin-top:10px;padding:12px;border-radius:12px;border:none;background:var(--acc);color:var(--accTxt);font-weight:600}
</style>
</head>
<body>
<header>
  <div class="wk">
    <button class="nav" id="prev" aria-label="Semaine précédente">‹</button>
    <div class="lbl" id="lbl"></div>
    <button class="nav" id="next" aria-label="Semaine suivante">›</button>
  </div>
  <div class="days" id="days"></div>
</header>
<main id="main"></main>
<nav class="bottom"><button id="hist" aria-label="Historique"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg></button><button id="gear" aria-label="Réglages"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button><button id="prNav" aria-label="Charges de référence"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></button></nav>
<div class="cf" id="cf"><div class="box"><div id="cfT" style="font-weight:600;margin-bottom:6px"></div><div id="cfM" class="muted" style="font-size:14px;margin-bottom:14px"></div><div style="display:flex;gap:8px"><button class="hb" id="cfNo" style="flex:1">Annuler</button><button class="hb" id="cfYes" style="flex:1;background:var(--acc);color:var(--accTxt);border-color:var(--accInk)">Supprimer</button></div></div></div>
<div class="nt" id="nt"><div class="box" id="ntb"></div></div>
<div class="toast" id="toast"></div>
<div class="lock" id="lock"><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center"><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="96" height="96" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="lkbg" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#23281A"/>
      <stop offset="1" stop-color="#050604"/>
    </radialGradient>
    <radialGradient id="lkhalo">
      <stop offset="0.6" stop-color="#C6F432" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#C6F432" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#C6F432" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lkring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FFD0"/>
      <stop offset="1" stop-color="#6FB30F"/>
    </linearGradient>
    <filter id="lkblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#lkbg)"/>
  <rect x="0.5" y="0.5" width="199" height="199" rx="43.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <circle cx="100" cy="100" r="88" fill="url(#lkhalo)"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#C6F432" stroke-opacity="0.4" stroke-width="22" stroke-linecap="round" stroke-dasharray="342.1 97.7" transform="rotate(-90 100 100)" filter="url(#lkblur)"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#lkring)" stroke-width="18" stroke-linecap="round" stroke-dasharray="342.1 97.7" transform="rotate(-90 100 100)"/>
  <circle cx="31.1" cy="87.8" r="8" fill="#F7FFD0"/>
</svg><div style="margin-top:14px;color:#C6F432;font-family:Gilroy,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:20px;letter-spacing:.08em;line-height:1">ORA</div></div><div class="box"><input id="lkEmail" type="email" autocomplete="username" placeholder="Adresse e-mail" style="width:100%;height:52px;box-sizing:border-box;font-size:16px;margin-bottom:12px"><input id="lkPwd" type="password" autocomplete="current-password" placeholder="Mot de passe" style="width:100%;height:52px;box-sizing:border-box;font-size:16px;margin-bottom:12px"><button class="close" id="lkLogin">Se connecter</button></div></div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

<script>
/* ===== PROGRAMME : exemple à remplacer par tes séances réelles ===== */
const TEMPLATE = [
  {id:'a', name:'Force', day:1, exos:[
    {id:'a1', name:'Back squat', sets:4, reps:5, kg:80},
    {id:'a2', name:'Bench press', sets:4, reps:6, kg:60},
    {id:'a3', name:'Soulevé de terre', sets:3, reps:4, kg:100},
    {id:'a4', name:'Rowing barre', sets:4, reps:8, kg:50},
    {id:'a5', name:'Nordic curl', sets:3, reps:5, kg:0},
    {id:'a16', name:'Sledge pull', sets:3, reps:8, kg:50}
  ]},
  {id:'b', name:'Puissance', day:3, exos:[
    {id:'b1', name:'Power clean', sets:5, reps:3, kg:60},
    {id:'b6', name:'Front squat', sets:3, reps:4, kg:70},
    {id:'b3', name:'Power snatch', sets:4, reps:2, kg:40},
    {id:'b2', name:'Hang clean', sets:4, reps:3, kg:55},
    {id:'b5', name:'Sauts pliométriques', sets:3, reps:5, kg:0}
  ]},

function recordLedger(){
  // Journal figé : chaque variation du nombre de séries est enregistrée avec les données de l'exercice au moment de la saisie
  data.ledger=data.ledger||[]; data.seen=data.seen||{};
  const today=fmt(new Date()); const P=data.profile||{};
  Object.keys(data.weeks||{}).forEach(k=>{
    const w=data.weeks[k]; if(!w||!w.sets) return;
    const seen=data.seen[k]||(data.seen[k]={});
    const ids=new Set([...Object.keys(w.sets),...Object.keys(seen)]);
    let meta=null;
    ids.forEach(id=>{
      const cur=Math.max(0,w.sets[id]||0), prev=seen[id]||0;
      if(cur===prev) return;
      if(!meta){ meta={}; sessions(w).forEach(s=>s.exos.forEach(e=>{ meta[e.id]=e; })); }
      const e=meta[id];
      if(e){ data.ledger.push({d:today,wk:k,id,name:e.name,reps:e.reps||1,kg:e.kg||0,n:cur-prev,prog:P.orient||'judo',sub:P.sub||''}); }
      seen[id]=cur;
    });
  });
}

function varIdx(w,id){return (w.variant&&w.variant[id]!==undefined)?w.variant[id]:((wkOf(w)%3)+3)%3}
function relWeek(w){ const cur=fmt(wstart(0)); if(!w||!w.key) return 0; return w.key<cur?-1:(w.key>cur?1:0); }
function freeDay(d){ const J=jDays(); if(!J.includes(d)) return d; for(let k=1;k<=6;k++){ const a=(d+k)%7, b=(d-k+7)%7; if(!J.includes(a)) return a; if(!J.includes(b)) return b; } return d; }
function sessions(w,raw){const r=w.removed||{},ad=w.addons||{},mv=w.moved||{},dp=w.dropped||{},dd=w.doneDay||{};return [...TPL().filter(s=>!r[s.id]&&!dp[s.id]),...(w.extra||[])].map(s=>{const bank=BANK[s.id], vv=VARS[s.id], vi=varIdx(w,s.id); let base=(bank&&!s.log)?bank[vi]:(vv&&!s.log)?(vi===0?s.exos:vv[vi]):s.exos; if(!s.log&&!bank) base=base.map(e=>e.km?{...e,km:Math.round(e.km*phKm(w)*2)/2}:e); const PJ=data.profile||{}; if(!s.log&&bank&&PJ.orient==='judo'&&PJ.jm==='comp') base=base.map(e=>blockMod(e,blockOf(w))); const rawDay=dd[s.id]!==undefined?dd[s.id]:(mv[s.id]!==undefined?mv[s.id]:s.day); const keepDay=raw||s.log||isJudoS(s)||w.done[s.id]||dd[s.id]!==undefined; return {...s,day:keepDay?rawDay:freeDay(rawDay),exos:applyTrim(w,s.id,[...base,...(ad[s.id]||[])].map(e=>s.log?e:{...e,kg:kgOf(e)}))}})}
const MIN_EXOS=2, MIN_SETS=2, MIN_SESSION_SETS=4;
function applyTrim(w,id,ex){ const tr=(w.trim||{})[id], mg=(w.merged||{})[id]||[]; if(!tr) return ex.concat(mg); return ex.filter(e=>tr[e.id]!==undefined).map(e=>({...e,sets:tr[e.id]})).concat(mg); }
function findExo(id){for(const s of sessions(W())){const e=s.exos.find(x=>x.id===id);if(e)return{s,e}}}
function doneSets(s,w){return s.exos.reduce((a,e)=>a+Math.min(w.sets[e.id]||0,e.sets),0)}
function planned(s){return s.exos.reduce((a,e)=>a+e.sets,0)}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1600)}

function render(){
  const w=W(), ws=wstart(offset), we=new Date(ws); we.setDate(ws.getDate()+6);
  const o={day:'numeric',month:'short'};
  document.getElementById('lbl').textContent=
    offset===0?T('Cette semaine')+' · '+ws.toLocaleDateString(loc(),o)+' – '+we.toLocaleDateString(loc(),o)
    :ws.toLocaleDateString(loc(),o)+' – '+we.toLocaleDateString(loc(),o);

  // Calendrier : une ligne
  document.getElementById('days').innerHTML=[0,1,2,3,4,5,6].map((i)=>{ const d=dayL(i);
    const date=new Date(ws);date.setDate(ws.getDate()+i);
    const sess=sessions(w).filter(s=>s.day===i&&(!jDays().includes(i)||isJudoS(s)));
    const allDone=sess.length&&sess.every(s=>w.done[s.id]);
    const cls=['day',sess.length?'has':'',allDone?'ok':'',i===selDay?'sel':'',(offset===0&&i===todayIdx)?'today':''].join(' ');
    return `<button class="${cls}" data-day="${i}"><span>${d}</span><b>${date.getDate()}</b><i></i></button>`;
  }).join('');

  // Réévaluation de la semaine
  const ALL=sessions(w).filter(s=>!s.log);
  const isPlan=s=>!s.extra||!!s.replaces;
  const totP=ALL.filter(isPlan).reduce((a,s)=>a+planned(s),0);
  const extraP=totP-TPL().reduce((a,s)=>a+planned(s),0);
  const totD=ALL.reduce((a,s)=>a+doneSets(s,w),0)+sessions(w).filter(s=>s.log).reduce((a,s)=>a+bonusOf(s),0);
  const consumed=ALL.reduce((a,s)=>a+s.exos.reduce((b,e)=>b+exoLoad(s,e,Math.min(w.sets[e.id]||0,e.sets),s.exos.reduce((c,x)=>c+x.sets,0)),0),0);
  const pct=budgetOf()?Math.round(consumed/budgetOf()*100):0;
  const remS=ALL.filter(s=>!w.done[s.id]);
  const remSets=totP-totD;
  const remDays=offset===0?7-todayIdx:(offset>0?7:0);
  const late=offset===0?remS.filter(s=>s.day<todayIdx):[];
  let warn='';
  if(offset===0&&late.length) warn+=`<div class="warn">En retard : ${late.map(s=>esc(s.name)).join(', ')}</div>`;
  if(remS.length&&remDays>0&&remS.length>remDays) warn+=`<div class="warn">${remS.length} séances restantes pour ${remDays} jour(s) : prioriser ou alléger.</div>`;
  if(remS.length&&remDays===0&&offset<0) warn+=`<div class="warn">Semaine passée : ${remS.length} séance(s) non validée(s).</div>`;
  const hiddenA=sessions(w).filter(s=>s.day===selDay&&jDays().includes(selDay)&&!isJudoS(s));
  const hiddenHtml=hiddenA.length?`<div class="warn">${hiddenA.map(s=>esc(T(s.name))).join(', ')} : prévu un jour de judo. Accepte la semaine proposée pour la replanifier.</div>`:'';
  const rem=remS.length
    ?`Reste : ${remS.map(s=>esc(s.name)).join(' · ')}`
    :'Toutes les séances de la semaine sont validées ✓';
  document.getElementById('main').innerHTML=`
    <div class="sum">
      <button class="sumh" data-sumtoggle="1"><span>${T('Objectif hebdomadaire')}</span><span><b>${pct}%</b> ${sumOpen?'▲':'▼'}</span></button>
      <div class="bar"><div class="${pct>100?'over':''}" style="width:${Math.min(pct,100)}%"></div></div>
      ${sumOpen?`<div class="sumd"><div class="muted" style="margin-bottom:6px"><b>${totD}/${totP}</b> séries validées${extraP?` · plan ${extraP>0?'+':''}${extraP} séries`:''}</div>`:''}
      ${sumOpen?`${ALL.flatMap(s=>s.exos.map(e=>{const d=Math.min(w.sets[e.id]||0,e.sets); const dots=Array.from({length:e.sets},(_,i)=>`<i class="dot ${i<d?'on':''}"></i>`).join(''); return `<div class="row"><span>${esc(s.name)} · ${esc(e.name)}</span><span class="dots">${dots}</span></div>`})).join('')}`:''}
      ${sumOpen?warn+'</div>':''}
    </div>
    ${hiddenHtml}${sessions(w).filter(s=>s.day===selDay&&(!jDays().includes(selDay)||isJudoS(s))).map(s=>{
      const isDone=!!w.done[s.id], d=doneSets(s,w), p=planned(s), can=!isDone;
      return `<section class="sess">
        <div class="sh" ${s.extra?`data-times="${s.id}"`:''}><h3 style="display:inline-block;margin-left:6px;background:${colorOf(s)};color:#111;padding:2px 10px;border-radius:999px">${esc(T(s.name))}${s.times>1?' ×'+s.times:''}</h3><span class="hbtns">${!isDone&&!s.log?`<button class="hb" data-move="${s.id}">${T('Reporter')}</button>`:''}${can?`<button class="hb" data-mod="${s.id}">${T('Modifier')}</button>`:''}${can&&!s.extra&&!s.exos.some(e=>(w.sets[e.id]||0)>0)?`<button class="hb" data-del="${s.id}">${T('Supprimer')}</button>`:''}${s.extra?`<button class="hb" data-rm="${s.id}">${T('Retirer')}</button>`:''}</span></div>
        ${s.exos.map(e=>{
          const c=Math.min(w.sets[e.id]||0,e.sets), full=c>=e.sets;
          return `<button class="exo ${full?'full':''}" data-e="${e.id}">
            <span class="n">${esc(T(e.name))}</span>
            <span class="m">${e.pace?(e.km?e.km+' km · ':'')+e.pace:e.reps+' rep'}${e.kg?' · '+e.kg+' kg':''}</span>
            <span class="p" data-sw="${e.id}">${c}/${e.sets}</span></button>`;
        }).join('')}
        <div class="addwrap">${can&&!s.log?`<button class="addex" data-addex="${s.id}" aria-label="Ajouter un exercice">${T('Ajouter un exercice')}</button>`:''}</div><button class="sdone ${isDone?'on':''}" data-s="${s.id}">${isDone?'✓ '+T('Terminé'):T('Valider')}</button>
      </section>`;
    }).join('') || (jDays().includes(selDay)?'':`<div class="empty">Pas de séance ce jour.<br><button class="addbtn" data-add="1">+ Ajouter une séance</button></div>`)}
  `;
}

/* Double-tap = valider / annuler un exercice ; appui long = détails */
function tap(id){
  const now=Date.now();
  if(lastTap[id]&&now-lastTap[id]<400){
    lastTap[id]=0;
    openInfo(id);
  } else {
    lastTap[id]=now;
    const el=document.querySelector(`.exo[data-e="${id}"]`);
    if(el){el.classList.add('armed');setTimeout(()=>el.classList.remove('armed'),400)}
  }
}

function adjustSeries(id,delta){
  const f=findExo(id); if(!f) return;
  const w=W(), c=Math.min(w.sets[id]||0,f.e.sets);
  w.sets[id]=Math.max(0,Math.min(f.e.sets,c+delta));
  save(); render();
}

function exoLoad(s,e,n,tot){

  const f=tot>0?n/tot:0;

  const met=judo?9:cat==='puissance'?6:cat==='force'?5:7;

  sessions(w).filter(s=>w.done[s.id]).forEach(s=>{const c=coefOf(s); for(const k in c) credit[k]+=c[k];});

  const tot0=s=>s.exos.reduce((a,e)=>a+e.sets,0);
  const partLoad=s=>s.exos.reduce((a,e)=>a+exoLoad(s,e,dn(s,e),tot0(s)),0);
  const remLoad=(s,ex)=>ex.reduce((a,e)=>a+exoLoad(s,e,Math.max(0,e.sets-dn(s,e)),tot0(s)),0);
  let budRem=budgetOf()-all.filter(s=>isJudoS(s)||w.done[s.id]).reduce((a,s)=>a+loadOf(s),0)-all.filter(s=>!isJudoS(s)&&!w.done[s.id]&&isTpl(s)&&!s.log).reduce((a,s)=>a+partLoad(s),0);
  const okB=new Set();

    while(cost()>budRem+1e-6){
      const rm=exos.map((e,i)=>dn(s,e)===0?i:-1).filter(i=>i>=0).pop();
      if(exos.length>MIN_EXOS && rm!==undefined){ exos.splice(rm,1); continue; }

      const tr=w.trim[stub.id];

  let gapL=budRem;

      cur.forEach(e=>{

    w.trim[best.sx.id][best.id]++; gapL-=best.inc;
  }
  if(!cmpStarted && gapL>0.1){
    // La charge d'une séance dépend surtout de sa durée : on règle la durée de la séance complémentaire sur le reliquat
    const exo={id:'cmp_0',name:'Circuit judo sans contact',sets:1,reps:1,kg:0};
    const cc=d=>costOf({kind:'endurance',dur:d,exos:[exo]},[exo]);

  const heavyDays=sessions(w).filter(s=>w.done[s.id]&&['force','puissance'].includes(catOf(s))).map(s=>s.day);

function assignVariants(w){

function runRecalc(auto){

function revertSession(){const w=W();const s=(w.extra||[]).find(x=>x.id===sm.target);if(!s)return;uncredit(w,s);delete w.removed[s.replaces];w.extra=w.extra.filter(x=>x.id!==sm.target);delete w.done[sm.target];save();closeOv();render();toast('Séance rétablie')}

  const dl=e.target.closest('[data-del]'); if(dl){askDelete(dl.dataset.del);return}

  const rm=e.target.closest('[data-rm]');
  if(rm){removeExtra(rm.dataset.rm);return}
  const tm=e.target.closest('[data-times]'); if(tm){openTimes(tm.dataset.times);return}
  const s=e.target.closest('.sdone');
  if(s){
    const w=W(); const on=!w.done[s.dataset.s]; w.done[s.dataset.s]=on;
    if(on){ w.doneDay=w.doneDay||{}; const sx=sessions(w).find(x=>x.id===s.dataset.s); if(sx) w.doneDay[sx.id]=sx.day; } else if(w.doneDay){ delete w.doneDay[s.dataset.s]; }
    if(on) journalSession(w,s.dataset.s);
    save(); runRecalc(true);
    if(on) setTimeout(()=>showNutriNotif(s.dataset.s),900);

  }

const SB_URL='https://dhykpfkuctmgqfwwziux.supabase.co';
const SB_KEY='sb_publishable_9UhltWSMVwsYPkJT5VslZg_-u1bTYMM';
let sb=null, sbUser=null, remoteT=null;
try{ if(window.supabase) sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}}); }catch(e){ sb=null; }
function queueRemote(){ if(!sb||!sbUser) return; clearTimeout(remoteT); remoteT=setTimeout(pushRemote,1500); }
async function pushRemote(){
  if(!sb||!sbUser) return;
  try{
    const {error}=await sb.from('app_data').upsert({user_id:sbUser.id,data:data,updated_at:new Date().toISOString()});
    if(error) throw error;
  }catch(e){ toast(T('Synchronisation impossible, sauvegarde locale conservée')); }
}
async function pullRemote(){
  if(!sb||!sbUser) return;
  try{
    const {data:row,error}=await sb.from('app_data').select('data').eq('user_id',sbUser.id).maybeSingle();
    if(error) throw error;
    if(row&&row.data&&Object.keys(row.data).length){
      data=row.data; try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}
      data.weeks=data.weeks||{}; data.notes=data.notes||{};
      render(); toast(T('Données synchronisées'));
    } else { await pushRemote(); }
  }catch(e){ toast(T('Synchronisation impossible, sauvegarde locale conservée')); }
}
async function sbSendCode(email){ if(!sb) return 'Connexion indisponible'; const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}}); return error?error.message:null; }
async function sbVerify(email,token){ if(!sb) return 'Connexion indisponible'; const {error}=await sb.auth.verifyOtp({email,token,type:'email'}); return error?error.message:null; }
async function sbSignOut(){ if(sb) await sb.auth.signOut(); sbUser=null; toast(T('Déconnecté')); }
async function sbSignIn(email,password){ if(!sb) return 'Connexion indisponible'; const {error}=await sb.auth.signInWithPassword({email,password}); return error?error.message:null; }

    body=`<div class="muted" style="margin-bottom:12px">${T('Connecté')} : ${esc(sbUser.email)}</div><button class="back" id="acOut">${T('Se déconnecter')}</button>`;

  }
  document.getElementById('modal').innerHTML=`<h2>${T('Compte')}</h2>${body}<button class="back" data-close="1">${T('Fermer')}</button>`;

async function initSupabase(){
  if(!sb) return;
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session){ sbUser=session.user; await pullRemote(); } else { showLock(); }
    sb.auth.onAuthStateChange((_e,sess)=>{ sbUser=sess?sess.user:null; });
  }catch(e){}
}
async function initStore(){
  try{
    const c=window.claude, db=c&&await c.use('db'), user=c&&await c.use('user');
    const uid=user?await user.id():null;
    if(db&&uid){
      dbRef=db.doc('data/users/'+uid+'/state');
      const s=await dbRef.get();
      if(s.exists){ const j=(s.data()||{}).json; if(j) data=JSON.parse(j); }
      else { save(); }
    }
  }catch(e){ toast('Stockage distant indisponible : sauvegarde locale'); }
  data.weeks=data.weeks||{}; data.notes=data.notes||{};
  await initSupabase();
  offset=0; selDay=todayIdx;
  if(data.theme) document.documentElement.dataset.theme=data.theme;
  render();
}
